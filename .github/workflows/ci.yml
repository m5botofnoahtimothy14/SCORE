name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Unit + security-mirror tests
        run: npm test
      - name: Install admin deps
        run: npm --prefix apps/admin ci
      - name: Typecheck admin DMS
        run: npm --prefix apps/admin run typecheck
      - name: Typecheck contracts
        run: npm run typecheck:contracts
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Analyze Flutter app
        run: flutter analyze --no-pub
        working-directory: apps/mobile
      - name: Test Flutter app
        run: flutter test --no-pub
        working-directory: apps/mobile
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck all Supabase Edge Functions
        run: |
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
          if [ ${#functions[@]} -eq 0 ]; then
            echo "No Edge Function entrypoints found"
            exit 1
          fi
          deno check --no-lock "${functions[@]}"
      - name: Lint admin DMS
        run: npm --prefix apps/admin run lint
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
