# TeachCross Supabase project config
# Apply with: supabase db push / supabase functions deploy

[project]
name = "teachcross"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Private buckets are created in migration 00007_storage.sql.
# File-size limits are enforced in edge code + school_settings.max_file_size_mb.

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
# Mobile student flow uses anonymous sign-in then activation; teachers use
# email/phone OTP via edge functions. Admins use email+password in the DMS.
# Enable anonymous sign-ins in Dashboard > Authentication > Providers for
# the student activation flow.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
port = 54324

# Realtime is enabled per-table via migrations (supabase_realtime publication).

# ============================================================
# Edge functions
# ============================================================
# Functions that disable gateway JWT verification must validate their own
# caller or signed webhook secret. Functions not listed here keep the gateway
# JWT check enabled. Do not disable verification without an explicit auth check.
[functions.moderate-message]
verify_jwt = false

[functions.moderate-image]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.send-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

[functions.activate-student]
verify_jwt = false

[functions.publish-announcement]
verify_jwt = false

[functions.score-moderation]
verify_jwt = false

[functions.curriculum-rag]
verify_jwt = false

[functions.create-google-meet]
verify_jwt = false

[functions.google-workspace-oauth]
verify_jwt = false
