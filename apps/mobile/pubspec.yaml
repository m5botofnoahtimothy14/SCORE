name: teachcross_mobile
description: SCORE+ — Secure school communication platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^13.2.0
  
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  
  # Notifications
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  
  # Media
  image_picker: ^1.1.2
  flutter_sound: ^9.2.13
  
  # Storage & Files
  path_provider: ^2.1.3
  
  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  
  # Security
  flutter_secure_storage: ^9.2.2
  
  # Launch URLs (Google Meet links, etc.)
  url_launcher: ^6.3.1
  
  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
